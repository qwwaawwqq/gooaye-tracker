name: Update episodes (RSS → whisper → Claude → push)

# When 股癌 publishes (Wed/Sat 16:00 TPE), give the feed a buffer then run.
# 12:00 UTC = 20:00 Taipei, 14:00 UTC = 22:00 Taipei.
# Also a Thu/Sun 01:00 UTC sweep in case the earlier runs missed something.
on:
  schedule:
    - cron: "0 12 * * 3,6"   # Wed/Sat 20:00 TPE
    - cron: "0 14 * * 3,6"   # Wed/Sat 22:00 TPE
    - cron: "0  1 * * 4,0"   # Thu/Sun 09:00 TPE
  workflow_dispatch:
    inputs:
      force_ep:
        description: "Re-process a specific episode (leave blank for normal RSS scan)"
        required: false
        default: ""
      model:
        description: "Whisper model"
        required: false
        default: "small"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Python deps
        run: |
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet openai-whisper anthropic

      - name: Cache whisper model
        uses: actions/cache@v4
        with:
          path: ~/.cache/whisper
          key: whisper-small-v1

      - name: Cache episode audio + transcripts
        uses: actions/cache@v4
        with:
          path: .cache_audio
          key: gooaye-cache-${{ github.run_id }}
          restore-keys: gooaye-cache-

      - name: Configure git identity
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Run auto_update.py
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          ARGS="--push --model ${{ github.event.inputs.model || 'small' }}"
          if [ -n "${{ github.event.inputs.force_ep }}" ]; then
            ARGS="$ARGS --force-ep ${{ github.event.inputs.force_ep }}"
          fi
          python auto_update.py $ARGS

      - name: Prune cache (keep last 8 episodes)
        run: |
          cd .cache_audio || exit 0
          ls -t EP*.mp3 2>/dev/null | tail -n +9 | xargs -r rm -v
          ls -t EP*.txt 2>/dev/null | tail -n +9 | xargs -r rm -v
